---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: dist

- name: Install required packages
  ansible.builtin.apt:
    name:
      - python3-dev
      - python3-pip
      - python3-venv
      - git
      - libffi-dev
      - gcc
      - libssl-dev
    state: present
